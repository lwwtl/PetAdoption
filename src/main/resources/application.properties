server.port=8885
server.servlet.context-path=/

spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/petadoption?characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root

# 对象存储密钥已从仓库移除。图片上传需要自己的账号；留空时其余功能仍可本地运行。
ucloud.ufile.public-key=
ucloud.ufile.private-key=
ucloud.ufile.bucket-name=
ucloud.ufile.region=cn-bj
ucloud.ufile.suffix=ufileos.com
ucloud.ufile.expires=315360000

mybatis.mapper-locations=classpath:/com/pet/mapper/*.xml
mybatis.type-aliases-package=com.pet.demo.entity

pagehelper.helperDialect=mysql
pagehelper.reasonable=true
pagehelper.supportMethodsArguments=true
pagehelper.params=count=countSql

spring.aop.auto=true

spring.resources.static-locations=classpath:/templates,classpath:/static/

